<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14231a">
  <meta name="description" content="SprayWise reads a pesticide packet and checks it against official Indian lists, in English, Hindi, Telugu and Tamil.">
  <title>SprayWise</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="/icon.svg#m"/></svg>
      <div>
        <h1>SprayWise</h1>
        <p id="tagline" class="tag"></p>
      </div>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" lang="en">EN</button>
      <button data-lang="hi" lang="hi">हि</button>
      <button data-lang="te" lang="te">తె</button>
      <button data-lang="ta" lang="ta">த</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>
  <div id="status" class="sr" role="status" aria-live="polite"></div>

  <nav class="tabs" aria-label="Main">
    <button data-view="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg><span data-t="nav.scan"></span></button>
    <button data-view="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg><span data-t="nav.search"></span></button>
    <button data-view="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-t="nav.plan"></span></button>
    <button data-view="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v5M12 8v.01"/></svg><span data-t="nav.about"></span></button>
  </nav>

  <script src="/app.js" defer></script>
</body>
</html>
